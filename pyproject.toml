# hatchling instead of flit: flit cannot leave the tests out of the wheel
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "eos_sig_checker"
description = "A shared list of cosmic signatures: paste the probe scanner, get the known sites back"
dynamic = ["version"]
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
authors = [
    { name = "Flo", email = "xxxeoeoxxx@gmail.com" },
]
classifiers = [
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
]
dependencies = [
    # 5.0 for page-header.html and the sri/navactive tags; migration 0001
    # depends on eveonline 0001 only. Checked by reading, not by running
    # against 5.0.
    "allianceauth>=5.0,<6",
    # the settings page is a singleton; AA ships django-solo, but we import it
    "django-solo",
    # location tracking: the OpenAPI client (ESIClientProvider) and the
    # Token model; AA ships django-esi, but we import it. 10 is the version
    # tested with and the one AA 5.5 requires.
    "django-esi>=10",
]

[project.optional-dependencies]
# tools/translate.py needs polib; tox and coverage run the suite standalone
dev = [
    "coverage",
    "polib",
    "tox",
]

[project.urls]
Homepage = "https://github.com/fthomas-de/eos-sig-checker"
Source = "https://github.com/fthomas-de/eos-sig-checker"
Changelog = "https://github.com/fthomas-de/eos-sig-checker/blob/main/CHANGELOG.md"
Tracker = "https://github.com/fthomas-de/eos-sig-checker/issues"

[tool.hatch.version]
path = "eos_sig_checker/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["eos_sig_checker"]
exclude = ["eos_sig_checker/tests"]

[tool.hatch.build.targets.sdist]
include = ["/eos_sig_checker", "/CHANGELOG.md"]
exclude = ["/eos_sig_checker/tests"]

[tool.isort]
profile = "black"
multi_line_output = 3
sections = [
    "FUTURE",
    "STDLIB",
    "THIRDPARTY",
    "DJANGO",
    "ALLIANCEAUTH",
    "FIRSTPARTY",
    "LOCALFOLDER"
]
known_allianceauth = ["allianceauth", "app_utils"]
known_django = ["django", "solo"]

[tool.pylint.'MASTER']
ignore-patterns = ["test_.*.py,__init__.py", "generate_.*.py"]
ignore-paths = ["^.*//migrations//.*$"]

[tool.pylint.'BASIC']
good-names = ["i", "j", "k", "x", "f", "ex"]

[tool.pylint.'FORMAT']
max-line-length = 120

[tool.pylint.'MESSAGES CONTROL']
disable = ["E0213", "E1101", "C0209", "C"]
